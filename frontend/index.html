<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR CRM MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script defer src="./static/scripts.js?v=1.1.5"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; touch-action: pan-y; }
    body.dragging-active, 
    body.dragging-active * {
        user-select: none !important;
        -webkit-user-select: none !important;
        -webkit-touch-callout: none !important;
    }

    .card-ghost  { opacity:0!important; background:#e0e7ff; border:2px dashed #818cf8; border-radius:.5rem; min-height:56px; pointer-events:none; }
    .card-drag {transition: none !important; position: fixed !important; z-index: 99999 !important; pointer-events: none !important; width: 270px !important; margin: 0 !important; opacity: 1 !important;}
    .card-chosen { cursor:grab; }
    .col-ghost   { opacity:0!important; border:2px dashed #a5b4fc; border-radius:.75rem; background:#eef2ff; min-width:270px; pointer-events:none; }
    .col-drag    { opacity:1 !important; box-shadow:0 20px 48px rgba(0,0,0,.28); transform:rotate(.8deg) scale(1.02); cursor:grabbing!important; z-index:9999; background:#fff; border-radius:.75rem; }
    .col-chosen  { cursor:grab; }
    .remote-drag { outline:2px solid #f59e0b; outline-offset:2px; background:#fffbeb!important; }
    .sortable-fallback { opacity: 1 !important; display: block !important; position: fixed !important; z-index: 9999 !important;}
    .card-item   { cursor:grab; transition:box-shadow .12s; }
    .card-item:hover { box-shadow:0 3px 10px rgba(0,0,0,.09); }
    .col-handle  { cursor:grab; }
    .col-handle:active { cursor:grabbing; }
    .ws-on  { background:#22c55e; }
    .ws-off { background:#ef4444; }
    dialog::backdrop { background:rgba(0,0,0,.4); }
    @keyframes slideInRight {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
    }

    .animate-notification {
      animation: slideInRight 0.4s ease-out forwards;
    }

    /* ── Toast animations ────────────────────────────────────────────── */
    @keyframes slide-in {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .animate-slide-in { animation: slide-in 0.3s ease-out forwards; }

    @keyframes bounce-in {
      0% { transform: scale(0.9); opacity: 0; }
      70% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }
    .animate-bounce-in { animation: bounce-in 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }

    /* ── Dialog ──────────────────────────────────────────────────────── */
    dialog { border:none; border-radius:1rem; padding:0; box-shadow:0 25px 60px rgba(0,0,0,.25); max-width:95vw; }
    dialog::backdrop { background:rgba(0,0,0,.45); backdrop-filter:blur(2px); }

    /* ── Deadline badge colours ──────────────────────────────────────── */
    .deadline-ok      { background:#dcfce7; color:#15803d; }
    .deadline-soon    { background:#fef9c3; color:#a16207; }   /* <24 h */
    .deadline-overdue { background:#fee2e2; color:#b91c1c; }

    /* ── Flat datetime-local input ───────────────────────────────────── */
    input[type="datetime-local"] { color-scheme: light; }
 
    /* ── Card preview image ──────────────────────────────────────────── */
    .card-preview-img { width:100%; height:100px; object-fit:cover; border-radius:.5rem .5rem 0 0; display:block; }
 
    /* ── Scrollbar thin ─────────────────────────────────────────────── */
    .thin-scroll::-webkit-scrollbar { width:4px; }
    .thin-scroll::-webkit-scrollbar-track { background:transparent; }
    .thin-scroll::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }
 
    /* ── Responsive board ────────────────────────────────────────────── */
    @media (max-width: 640px) {
      #board { flex-direction:column; align-items:stretch; overflow-x:visible; }
      #board > div { min-width:unset !important; max-width:unset !important; }
      main { padding:0.75rem; }
    }

    /* touch-action: none на draggable-элементах чтобы браузер не перехватывал touch */
    .card { touch-action: none; }
    .col-handle { touch-action: none; }

    /* ── Comments input ────────────────────────────────────────────── */
    .comment-item { border-bottom: 1px solid #f1f5f9; padding: 0.75rem 0; }
    .comment-item:last-child { border-bottom: none; }

    .emoji-picker {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      padding: 8px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      position: absolute;
      bottom: 100%;
      right: 0;
      margin-bottom: 8px;
      z-index: 50;
    }
    .emoji-btn { padding: 4px; border-radius: 4px; transition: background 0.2s; }
    .emoji-btn:hover { background: #f1f5f9; }

    #comments-list {
      scroll-behavior: smooth;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Отключаем визуальный указатель возможности перетаскивания в архиве */
    #board.archive-mode .column {
        cursor: default !important;
    }

    #board.archive-mode .col-handle {
        cursor: default !important;
    }

    #board.archive-mode .card-item {
        cursor: default !important;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- ── TOAST container ─────────────────────────────────────────────────── -->
<div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none w-80 max-w-[calc(100vw-2rem)]"></div>

<!-- ── HEADER ──────────────────────────────────────────────────────────── -->
<header class="bg-white shadow-sm sticky top-0 z-50">

  <!-- ── Верхняя строка: лого + бургер (мобиль) / все контролы (десктоп) ── -->
  <div class="px-4 sm:px-6 h-14 flex items-center justify-between gap-3">

    <!-- Лого -->
    <h1 class="text-lg font-bold text-indigo-600 flex items-center gap-2 flex-shrink-0">
      <span>📋</span><span>HR CRM</span>
    </h1>

    <!-- Десктоп-контролы (sm и выше) -->
    <div class="hidden sm:flex items-center gap-2 flex-1 justify-end">

      <!-- Auth -->
      <div id="auth-area-desktop" class="flex items-center gap-2">
        <input id="auth-username" type="text" placeholder="Логин"
          class="border rounded-lg px-3 py-1.5 text-sm w-28 focus:outline-none focus:ring-2 focus:ring-indigo-400" maxlength="100"
          onkeydown="if(event.key==='Enter') doLogin()" />
        <input id="auth-password" type="password" placeholder="Пароль"
          class="border rounded-lg px-3 py-1.5 text-sm w-28 focus:outline-none focus:ring-2 focus:ring-indigo-400" maxlength="128"
          onkeydown="if(event.key==='Enter') doLogin()" />
        <button onclick="doLogin()"
          class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-indigo-700 font-medium">Войти</button>
        <button onclick="doRegister()"
          class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-emerald-700 font-medium">Регистр.</button>
      </div>

      <!-- User info + filters -->
      <div id="user-info" class="hidden items-center gap-2 text-sm text-slate-600">
        <div class="flex items-center gap-1.5 bg-slate-100 px-2.5 py-1.5 rounded-lg border border-slate-200">
          <label for="filter-select" class="text-[10px] uppercase font-bold text-slate-400 whitespace-nowrap">Фильтр:</label>
          <select id="filter-select" onchange="changeFilterMode(this.value)"
            class="bg-transparent border-none text-xs font-semibold text-slate-700 focus:ring-0 cursor-pointer outline-none">
            <option value="all">Все задачи</option>
            <option value="my" title="Двойное нажатие ПРОБЕЛ для быстрого приминения">Мои задачи</option>
            <option value="created">Созданные мной</option>
            <option value="archived" title="Двойное нажатие A для быстрого приминения">Архивированные</option>
            <option disabled>─── По приоритету ───</option>
            <option value="p-high">Высокий</option>
            <option value="p-medium">Средний</option>
            <option value="p-low">Низкий</option>
          </select>
        </div>
        <div class="flex items-center gap-1.5 bg-slate-100 px-2.5 py-1.5 rounded-lg border border-slate-200">
          <label for="sort-select" class="text-[10px] uppercase font-bold text-slate-400 whitespace-nowrap">Сорт.:</label>
          <select id="sort-select" onchange="changeSortMode(this.value)"
            class="bg-transparent border-none text-xs font-semibold text-slate-700 focus:ring-0 cursor-pointer outline-none">
            <option value="position">По позициям</option>
            <option value="priority">По приоритету</option>
            <option value="deadline">По дедлайну</option>
          </select>
        </div>
        <span class="h-4 w-px bg-slate-200"></span>
        <span class="font-semibold text-slate-800 flex items-center gap-1.5">
          <span class="bg-indigo-100 text-indigo-600 w-6 h-6 rounded-full flex items-center justify-center text-[10px]">👤</span>
          <span id="current-username"></span>
        </span>
        <button onclick="doLogout()"
          class="text-xs text-slate-400 hover:text-red-500 border border-slate-200 rounded-lg px-2.5 py-1.5 transition-colors bg-white">Выйти</button>
      </div>
    </div>

    <!-- Бургер (только мобиль) -->
    <button id="header-burger" class="sm:hidden flex-shrink-0 p-2 rounded-lg text-slate-500 hover:bg-slate-100 active:bg-slate-200 transition-colors"
      aria-label="Меню"
      onclick="var d=document.getElementById('header-drawer');var open=d.style.maxHeight&&d.style.maxHeight!=='0px';d.style.maxHeight=open?'0px':d.scrollHeight+'px';this.setAttribute('aria-expanded',!open)">
      <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>

  <!-- ── Мобильный drawer ── -->
  <div id="header-drawer"
    style="max-height:0; overflow:hidden; transition:max-height 0.3s ease"
    class="sm:hidden border-t border-slate-100 bg-white">
    <div class="px-4 py-4 flex flex-col gap-3">

      <!-- Форма авторизации -->
      <div id="auth-area" class="flex flex-col gap-2">
        <div class="flex gap-2">
          <input id="auth-username-m" type="text" placeholder="Логин"
            class="flex-1 border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" maxlength="100"
            onkeydown="if(event.key==='Enter') doLogin()" />
          <input id="auth-password-m" type="password" placeholder="Пароль"
            class="flex-1 border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" maxlength="128"
            onkeydown="if(event.key==='Enter') doLogin()" />
        </div>
        <div class="flex gap-2">
          <button onclick="doLogin()"
            class="flex-1 bg-indigo-600 text-white py-2.5 rounded-lg text-sm hover:bg-indigo-700 font-semibold">Войти</button>
          <button onclick="doRegister()"
            class="flex-1 bg-emerald-600 text-white py-2.5 rounded-lg text-sm hover:bg-emerald-700 font-semibold">Регистрация</button>
        </div>
      </div>

      <!-- Блок залогиненного пользователя -->
      <div id="user-info-mobile" class="hidden flex-col gap-3">
        <div class="flex items-center justify-between">
          <span class="font-semibold text-slate-800 flex items-center gap-2">
            <span class="bg-indigo-100 text-indigo-600 w-8 h-8 rounded-full flex items-center justify-center">👤</span>
            <span id="current-username-m" class="text-sm"></span>
          </span>
          <button onclick="doLogout()"
            class="text-xs text-slate-400 hover:text-red-500 border border-slate-200 rounded-lg px-3 py-2 bg-white">Выйти</button>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div class="flex items-center gap-1.5 bg-slate-100 px-2 py-2 rounded-lg border border-slate-200">
            <label class="text-[10px] uppercase font-bold text-slate-400 whitespace-nowrap">Фильтр:</label>
            <select id="filter-select-m" onchange="changeFilterMode(this.value);var d=document.getElementById('filter-select');if(d)d.value=this.value"
              class="bg-transparent border-none text-xs font-semibold text-slate-700 focus:ring-0 cursor-pointer outline-none flex-1 min-w-0">
              <option value="all">Все</option>
              <option value="my">Мои</option>
              <option value="created">Созданные</option>
              <option value="archived">Архив</option>
              <option value="p-high">Высокий</option>
              <option value="p-medium">Средний</option>
              <option value="p-low">Низкий</option>
            </select>
          </div>
          <div class="flex items-center gap-1.5 bg-slate-100 px-2 py-2 rounded-lg border border-slate-200">
            <label class="text-[10px] uppercase font-bold text-slate-400 whitespace-nowrap">Сорт.:</label>
            <select id="sort-select-m" onchange="changeSortMode(this.value);var d=document.getElementById('sort-select');if(d)d.value=this.value"
              class="bg-transparent border-none text-xs font-semibold text-slate-700 focus:ring-0 cursor-pointer outline-none flex-1 min-w-0">
              <option value="position">Позиция</option>
              <option value="priority">Приоритет</option>
              <option value="deadline">Дедлайн</option>
            </select>
          </div>
        </div>
      </div>

    </div>
  </div>

</header>

<!-- ── MAIN ────────────────────────────────────────────────────────────── -->
<main class="p-3 sm:p-6">
  <div class="flex flex-wrap gap-3 mb-3 items-center">
    <h2 class="text-base font-semibold text-slate-700">Доска</h2>
    <button id="btn-add-col" onclick="openAddColumn()" disabled
      class="bg-emerald-500 text-white px-3 py-1 rounded text-sm hover:bg-emerald-600
             disabled:opacity-40 disabled:cursor-not-allowed">+ Колонка</button>
  </div>
  <div class="flex gap-1.5 items-center text-sm text-slate-500 ml-auto mb-3">
    <span class="font-medium text-xs">Online:</span>
    <div id="online-users" class="flex gap-1.5 flex-wrap"></div>
  </div>
  <div id="board" class="flex gap-4 overflow-x-auto pb-6 items-start"></div>
</main>

<!-- ── EVENT LOG ───────────────────────────────────────────────────────── -->
<aside class="fixed bottom-4 right-4 w-72 bg-white border border-slate-200 rounded-xl shadow-lg z-10 hidden sm:block">
  <div class="flex justify-between items-center px-3 py-2 bg-slate-50 rounded-t-xl border-b">
    <span class="text-xs font-semibold text-slate-600">Event Log</span>
    <button onclick="clearLog()" class="text-xs text-slate-400 hover:text-slate-600">Очистить</button>
  </div>
  <div id="event-log" class="overflow-y-auto text-[11px] font-mono p-2 space-y-0.5 thin-scroll" style="max-height:160px;"></div>
</aside>

<!-- ═══════════════════════════════════════════════════════════════════════
     MODAL: Add Column
════════════════════════════════════════════════════════════════════════ -->
<dialog id="modal-add-column">
  <div class="p-6 w-80">
    <h3 class="font-semibold text-slate-800 mb-4">Новая колонка</h3>
    <input id="new-col-name" type="text" placeholder="Название колонки" maxlength="100"
      class="border border-slate-300 rounded-lg w-full px-3 py-2 mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
      onkeydown="if(event.key==='Enter') submitAddColumn()" />
    <div class="flex justify-end gap-2">
      <button onclick="document.getElementById('modal-add-column').close()"
        class="px-4 py-1.5 text-sm text-slate-500 hover:text-slate-700 rounded-lg hover:bg-slate-100">Отмена</button>
      <button onclick="submitAddColumn()"
        class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-sm hover:bg-indigo-700">Создать</button>
    </div>
  </div>
</dialog>

<!-- ═══════════════════════════════════════════════════════════════════════
     MODAL: Card (Create / Edit)
════════════════════════════════════════════════════════════════════════ -->
<dialog id="modal-card">
  <div class="w-full sm:w-[480px] max-h-[90vh] overflow-y-auto thin-scroll">
 
    <!-- Header -->
    <div class="flex justify-between items-center px-6 pt-5 pb-3 border-b border-slate-100">
      <h3 id="modal-card-title" class="font-semibold text-slate-800 text-base">Карточка</h3>
      <button onclick="document.getElementById('modal-card').close()"
        class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
    </div>
 
    <div class="px-6 py-4 flex flex-col gap-4">
      <!-- Hidden fields -->
      <input type="hidden" id="card-edit-id" />
      <input type="hidden" id="card-col-id" />
 
      <!-- Title -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1 uppercase tracking-wide">Заголовок *</label>
        <input id="card-title-input" type="text" maxlength="200" placeholder="Название задачи"
          class="border border-slate-300 rounded-lg w-full px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
          onkeydown="if(event.key==='Enter' && !event.shiftKey) submitCard()" />
      </div>
 
      <!-- Description -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1 uppercase tracking-wide">Описание</label>
        <textarea id="card-desc-input" rows="3" maxlength="1000" placeholder="Подробное описание…"
          class="border border-slate-300 rounded-lg w-full px-3 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
      </div>
 
      <!-- Deadline -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1 uppercase tracking-wide">Дедлайн</label>
        <div class="relative">
          <input id="card-deadline-input" type="datetime-local"
            class="border border-slate-300 rounded-lg w-full px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 pr-8" />
          <!-- Clear button -->
          <button id="card-deadline-clear" type="button" onclick="clearDeadline()"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-red-400 hidden text-base leading-none"
            title="Очистить дедлайн">×</button>
        </div>
        <p id="deadline-error" class="text-red-500 text-xs mt-1 hidden">Дедлайн должен быть позже текущего времени</p>
        <!-- Quick presets -->
        <div class="flex gap-2 mt-1.5 flex-wrap">
          <button type="button" onclick="setDeadlinePreset(1)"
            class="text-xs px-2 py-0.5 bg-slate-100 hover:bg-indigo-100 text-slate-600 hover:text-indigo-700 rounded-full">+1 день</button>
          <button type="button" onclick="setDeadlinePreset(3)"
            class="text-xs px-2 py-0.5 bg-slate-100 hover:bg-indigo-100 text-slate-600 hover:text-indigo-700 rounded-full">+3 дня</button>
          <button type="button" onclick="setDeadlinePreset(7)"
            class="text-xs px-2 py-0.5 bg-slate-100 hover:bg-indigo-100 text-slate-600 hover:text-indigo-700 rounded-full">+1 нед</button>
          <button type="button" onclick="setDeadlinePreset(30)"
            class="text-xs px-2 py-0.5 bg-slate-100 hover:bg-indigo-100 text-slate-600 hover:text-indigo-700 rounded-full">+1 мес</button>
        </div>
      </div>
      <!--Select priority-->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1 uppercase tracking-wide">Приоритет</label>
        <div class="grid grid-cols-3 gap-2">
          <label class="cursor-pointer">
            <input type="radio" name="card-priority" value="LOW" class="peer hidden" checked>
            <div class="text-center py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 peer-checked:bg-slate-100 peer-checked:border-slate-400 peer-checked:text-slate-900 transition-all">Низкий</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="card-priority" value="MEDIUM" class="peer hidden">
            <div class="text-center py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 peer-checked:bg-amber-50 peer-checked:border-amber-400 peer-checked:text-amber-700 transition-all">Средний</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="card-priority" value="HIGHT" class="peer hidden">
            <div class="text-center py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 peer-checked:bg-red-50 peer-checked:border-red-400 peer-checked:text-red-700 transition-all">Высокий</div>
          </label>
        </div>
      </div>
 
      <!-- Assignee search -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1 uppercase tracking-wide">Назначить</label>
        <div class="relative">
          <input id="card-assign-search" type="text" autocomplete="off" list="assign-suggestions"
            placeholder="Введите имя пользователя…"
            class="border border-slate-300 rounded-lg w-full px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          <datalist id="assign-suggestions"></datalist>
          <input type="hidden" id="card-assign-id" />
        </div>
      </div>
      <div id="attachments-section">
        <label class="block text-xs font-medium text-slate-500 mb-2 uppercase tracking-wide">Вложения</label>
        <div id="drop-zone"
          class="relative border-2 border-dashed border-slate-300 rounded-xl p-4
                 text-center cursor-pointer hover:border-indigo-400 hover:bg-indigo-50
                 transition-colors group"
          onclick="document.getElementById('attachment-file-input').click()"
          ondragover="event.preventDefault(); this.classList.add('border-indigo-500','bg-indigo-50')"
          ondragleave="this.classList.remove('border-indigo-500','bg-indigo-50')"
          ondrop="handleFileDrop(event)">

          <svg class="w-8 h-8 mx-auto mb-1.5 text-slate-300 group-hover:text-indigo-400 transition-colors"
            fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
