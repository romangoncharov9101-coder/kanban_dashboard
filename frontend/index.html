<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskBoard MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./static/scripts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .card-ghost  { opacity:0!important; background:#e0e7ff; border:2px dashed #818cf8; border-radius:.5rem; min-height:56px; pointer-events:none; }
    .card-drag   { opacity:.97; box-shadow:0 12px 28px rgba(0,0,0,.20); transform:rotate(1deg) scale(1.02); cursor:grabbing!important; }
    .card-chosen { cursor:grab; }
    .col-ghost   { opacity:0!important; border:2px dashed #a5b4fc; border-radius:.75rem; background:#eef2ff; min-width:270px; pointer-events:none; }
    .col-drag    { opacity:.96; box-shadow:0 16px 40px rgba(0,0,0,.22); transform:rotate(.8deg) scale(1.01); cursor:grabbing!important; }
    .col-chosen  { cursor:grab; }
    .remote-drag { outline:2px solid #f59e0b; outline-offset:2px; background:#fffbeb!important; }
    .card-item   { cursor:grab; transition:box-shadow .12s; }
    .card-item:hover { box-shadow:0 3px 10px rgba(0,0,0,.09); }
    .col-handle  { cursor:grab; }
    .col-handle:active { cursor:grabbing; }
    .ws-on  { background:#22c55e; }
    .ws-off { background:#ef4444; }
    dialog::backdrop { background:rgba(0,0,0,.4); }
    @keyframes slideInRight {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
    }

    .animate-notification {
      animation: slideInRight 0.4s ease-out forwards;
    }

    @keyframes slide-in {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .animate-slide-in { animation: slide-in 0.3s ease-out forwards; }

    @keyframes bounce-in {
      0% { transform: scale(0.9); opacity: 0; }
      70% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }
    .animate-bounce-in { animation: bounce-in 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

<header class="bg-white shadow-sm px-6 py-3 flex items-center justify-between">
  <h1 class="text-xl font-bold text-indigo-600">📋 TaskBoard MVP</h1>
  <div class="flex items-center gap-4">
    <div id="auth-area" class="flex items-center gap-2">
      <input id="auth-username" type="text" placeholder="Username"
        class="border rounded px-3 py-1.5 text-sm w-32"
        onkeydown="if(event.key==='Enter') doLogin()" maxlength="30"/>
      <input id="auth-password" type="password" placeholder="Password"
        class="border rounded px-3 py-1.5 text-sm w-32"
        onkeydown="if(event.key==='Enter') doLogin()" maxlength="108"/>
      <button onclick="doLogin()"
        class="bg-indigo-600 text-white px-3 py-1.5 rounded text-sm hover:bg-indigo-700">Login</button>
      <button onclick="doRegister()"
        class="bg-green-600 text-white px-3 py-1.5 rounded text-sm hover:bg-green-700">Register</button>
    </div>
    <div id="user-info" class="hidden items-center gap-2 text-sm text-gray-600">
      👤 <span id="current-username" class="font-semibold"></span>
      <button onclick="doLogout()"
        class="text-xs text-gray-400 hover:text-red-500 border rounded px-2 py-0.5">Logout</button>
    </div>
  </div>
</header>

<main class="p-6">
  <div class="flex gap-4 mb-3 items-center">
    <h2 class="text-lg font-semibold text-gray-700">Board</h2>
    <button id="btn-add-col" onclick="openAddColumn()" disabled
      class="bg-green-500 text-white px-3 py-1 rounded text-sm hover:bg-green-600
             disabled:opacity-40 disabled:cursor-not-allowed">+ Column</button>
  </div>
  <div class="mb-4 flex gap-2 items-center text-sm text-gray-600">
    <span class="font-medium">Online:</span>
    <div id="online-users" class="flex gap-2 flex-wrap"></div>
  </div>
  <div id="board" class="flex gap-4 overflow-x-auto pb-6 items-start"></div>
</main>

<aside class="fixed bottom-4 right-4 w-80 bg-white border-t border-l shadow-lg z-10">
  <div class="flex justify-between items-center px-4 py-2 bg-gray-50 border-b">
    <span class="text-sm font-semibold text-gray-700">Event Log</span>
    <button onclick="clearLog()" class="text-xs text-gray-400 hover:text-gray-600">Clear</button>
  </div>
  <div id="event-log" class="overflow-y-auto text-xs font-mono p-2 space-y-1" style="max-height:180px;"></div>
</aside>

<dialog id="modal-add-column" class="rounded-lg shadow-xl p-6 w-80">
  <h3 class="font-semibold mb-3">New Column</h3>
  <input id="new-col-name" type="text" placeholder="Column name"
    class="border rounded w-full px-3 py-2 mb-3 text-sm"
    onkeydown="if(event.key==='Enter') submitAddColumn()" maxlength="100"/>
  <div class="flex justify-end gap-2">
    <button onclick="document.getElementById('modal-add-column').close()"
      class="px-3 py-1 text-sm text-gray-500">Cancel</button>
    <button onclick="submitAddColumn()"
      class="bg-indigo-600 text-white px-4 py-1 rounded text-sm hover:bg-indigo-700">Create</button>
  </div>
</dialog>

<dialog id="modal-card" class="rounded-lg shadow-xl p-6 w-96">
  <h3 id="modal-card-title" class="font-semibold mb-3">Card</h3>
  <input type="hidden" id="card-edit-id" />
  <input type="hidden" id="card-col-id" />
  <label class="block text-sm text-gray-600 mb-1">Title</label>
  <input id="card-title-input" type="text" maxlength="200"
    class="border rounded w-full px-3 py-2 mb-3 text-sm"
    onkeydown="if(event.key==='Enter') submitCard()" maxlength="100"/>
  <label class="block text-sm text-gray-600 mb-1">Description</label>
  <textarea id="card-desc-input" rows="3"
    class="border rounded w-full px-3 py-2 mb-3 text-sm resize-none" maxlength="400"></textarea>
  <div class="flex justify-end gap-2">
    <button onclick="document.getElementById('modal-card').close()"
      class="px-3 py-1 text-sm text-gray-500">Cancel</button>
    <button onclick="submitCard()"
      class="bg-indigo-600 text-white px-4 py-1 rounded text-sm hover:bg-indigo-700">Save</button>
  </div>
  <label class="block text-sm text-gray-600 mb-1 leading-none mt-2">Assign To</label>
  <select id="card-assign-select" class="border rounded w-full px-3 py-2 mb-3 text-sm bg-white">
    </select>
</dialog>
</body>
</html>
