# [ADDED] nginx reverse proxy — решает проблему cross-origin cookie.
#
# Проблема: фронт на :8080, бэк на :8000 — разные origins (разные порты).
# SameSite=Lax cookie не отправляется в cross-origin fetch.
#
# Решение: nginx проксирует /api/* и /ws на бэкенд.
# Браузер видит один origin — http://localhost:8080.
# Cookie устанавливается и отправляется без CORS-проблем.
#
# Маршруты:
#   /api/*   → http://backend:8000/*   (REST)
#   /ws      → http://backend:8000/ws  (WebSocket)
#   /*       → /usr/share/nginx/html/  (статика фронта)

server {
    listen 80;
    server_name localhost;

    # --- Статика фронтенда ---
    root /usr/share/nginx/html;
    index index.html;

    # --- REST API proxy ---
    # Фронт обращается на /api/columns, /api/cards и т.д.
    # nginx стрипает /api и проксирует на бэкенд
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Пробрасываем cookie без изменений
        proxy_pass_header  Set-Cookie;
    }

    # --- WebSocket proxy ---
    location /ws {
        proxy_pass         http://backend:8000/ws;
        proxy_http_version 1.1;
        # Обязательные заголовки для Upgrade WebSocket
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        # Таймаут для долгоживущих WS-соединений
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # --- Fallback для SPA ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
