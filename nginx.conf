# nginx reverse proxy с security hardening.
#
# Маршруты:
#   /api/*   → http://backend:8000/*   (REST, только авторизованным)
#   /ws      → http://backend:8000/ws  (WebSocket)
#   /*       → /usr/share/nginx/html/  (статика фронта)

server {
    listen 80;
    server_name localhost;
    client_max_body_size 5M;

    # ── Скрываем версию nginx из заголовков ───────────────────────────────────
    # Без этого Response содержит: Server: nginx/1.27.3
    # Зная версию, атакующий ищет CVE именно под неё.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    # Эти заголовки добавляются ко всем ответам и закрывают ряд браузерных атак.

    # Запрещает браузеру "угадывать" Content-Type — защита от MIME sniffing атак.
    add_header X-Content-Type-Options   "nosniff"           always;

    # Запрещает встраивать сайт во <iframe> на других доменах — защита от Clickjacking.
    add_header X-Frame-Options          "DENY"              always;

    # Отключает передачу Referer на сторонние сайты — не утекает URL приложения.
    add_header Referrer-Policy          "no-referrer"       always;

    # Content Security Policy: разрешаем скрипты только с доверенных CDN.
    # Это основная защита от XSS — даже если злоумышленник вставит <script>,
    # браузер его заблокирует если домен не в whitelist.
    # upgrade-insecure-requests: при переходе на HTTPS автоматом подтянет http→https.
    add_header Content-Security-Policy
        "default-src 'self';
         script-src  'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net;
         style-src   'self' 'unsafe-inline' https://cdn.tailwindcss.com;
         connect-src 'self' ws: wss:;
         img-src     'self' data:;
         font-src    'self';
         object-src  'none';
         base-uri    'self';"
        always;

    # Permissions Policy: явно запрещаем доступ к камере, микрофону, геолокации —
    # даже если в JS кто-то попытается их запросить через инжектированный код.
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # ── Блокируем публичный доступ к OpenAPI документации ────────────────────
    # /docs и /openapi.json содержат полный контракт API: все эндпоинты,
    # схемы запросов и ответов, типы данных. Это карта для атакующего.
    # В production эти страницы должны быть доступны только разработчикам (VPN/IP).
    # Здесь закрываем полностью — если нужен доступ, раскомментируй allow + конкретный IP.
    location ~ ^/api/(docs|redoc|openapi\.json)$ {
        # allow 192.168.1.0/24;  # раскомментируй и впиши IP разработчиков
        deny all;
        return 403;
    }

    # ── REST API proxy ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass          http://backend:8000/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_pass_header   Set-Cookie;

        # Скрываем версию uvicorn из проксированных ответов
        proxy_hide_header   Server;
        add_header          Server "taskboard" always;
    }

    # ── WebSocket proxy ───────────────────────────────────────────────────────
    location /ws {
        proxy_pass          http://backend:8000/ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_set_header    X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_hide_header   Server;
    }

    # ── Статика фронтенда ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Кешируем статику агрессивно — JS/CSS с хешем в имени не меняются
        location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}